# Slop Audit L1.9 (pre-commit hooks) scored Absent for this repository, at the
# monorepo root and inside every package. Nothing gated a commit: the only
# workflow publishes to PyPI on a tag and runs no tests.
#
# THIS FILE EXISTED AND NOTHING RAN IT. Measured 2026-08-28: `.git/hooks/pre-commit`
# was the beads hook, which flushes issues and exits 0. `pre-commit install` had
# never been run, or beads had overwritten it. So the config below was written,
# reviewed and inert -- a gate that gates nothing, which is the shape the pytest
# hook's own comment warns about, one level up.
#
# Install once per clone, and pre-commit keeps the beads hook as
# `pre-commit.legacy` and runs it first:
#     uv run pre-commit install
#
# The audit's own analyzer ships a `--gate` mode built for this position. It is
# wired below as a manual-stage hook rather than an on-commit one, because it
# needs a checkout of the slop-audit repository that a contributor may not
# have. Run it deliberately:
#     uv run pre-commit run --hook-stage manual slop-audit-gate --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # L1.16 (trailing-whitespace density) is Clean at 0.0%. This keeps it
      # there. The whitespace is harmless; it is the staleness signal that
      # matters — a file nobody opened between generation and commit.
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      # THE BEADS FLUSH, WHICH INSTALLING pre-commit DISPLACED. `.git/hooks/
      # pre-commit` was the beads hook before today; pre-commit moved it to
      # `pre-commit.legacy` and does not chain to it, so the flush stopped
      # running the moment this config started working. Measured 2026-08-28.
      #
      # It is here rather than left as a legacy file because a hook that lives
      # only in one clone's .git is a hook nobody else gets, and a reader of
      # this file would not know it existed.
      #
      # It flushes pending issue changes into .beads/issues.jsonl before the
      # commit, so the daemon's own auto-flush cannot fire afterwards and
      # leave the commit without them. Both `bd` missing and the flush failing
      # are non-fatal: this never blocks a commit on its own account, which is
      # what the hook it replaces did.
      - id: beads-flush
        name: flush pending beads issues
        entry: sh -c 'command -v bd >/dev/null 2>&1 || exit 0; bd sync --flush-only >/dev/null 2>&1 || true; git add .beads/issues.jsonl 2>/dev/null || true'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # THE SUITE RUNS ON PUSH, NOT ON COMMIT, and the numbers are why.
      # Measured 2026-08-28 on 3,034 tests:
      #
      #     whole suite                        83s
      #     -m precommit                       44s
      #     -m "precommit and not network"     37s
      #
      # Both of the old comment's figures had gone stale. It said the whole
      # suite was ~14s, and it said the `precommit` marker was carried by zero
      # tests; 2,138 carry it now. Nothing was wrong when it was written.
      #
      # None of the three fits the 30s budget, and an 83s wait on every commit
      # is a gate people learn to pass with --no-verify. So the fast checks
      # above gate a commit and the suite gates a push, which is the last point
      # before the work leaves this machine.
      #
      # It is the WHOLE suite rather than the marked subset, because the 896
      # unmarked tests are a third of the coverage and a regression in them
      # would reach the remote.
      - id: pytest-declaro-persistum
        name: pytest (declaro-persistum, whole suite)
        entry: uv run --project packages/declaro-persistum pytest -q
        language: system
        pass_filenames: false
        files: ^packages/declaro-persistum/
        stages: [pre-push]

      # This gate PASSES: 0 production god-files. pool.py was 2689 LOC and
      # the sole L1.17 offender; declaro-tvx split it into eight modules,
      # none over 1000 lines.
      #
      # The ratchet is a COUNT of Any / # type: ignore hatches, not the
      # per-kloc density the report shows — getting that wrong once set it
      # to 22 against a real count of 649, and the gate caught it.
      #
      # Raised 649 -> 657 by the split, deliberately and reviewably. The
      # pool code's own count went 38 -> 45: six are the `from typing
      # import Any` line each extracted module now needs, one is a delegate
      # signature duplicating the moved function's. No new escape in logic.
      # Lower it as escapes are typed away (declaro-158).
      - id: slop-audit-gate
        name: slop audit L1 gate (manual)
        entry: >-
          uv run --project ~/dev/honest/open-honest/slop-audit/tools/l1_analyzer
          l1-analyzer packages/declaro-persistum --gate --lang python
          --max-type-escapes 657
        language: system
        pass_filenames: false
        stages: [manual]
